<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="مجموعة برامج وأدوات عربية بسيطة تعمل مباشرة من المتصفح">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">

  <title>برامج عادل</title>
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="برامج عادل">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, #17345f 0, transparent 35%),
        radial-gradient(circle at bottom left, #0b5f68 0, transparent 32%),
        #08111f;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      padding:
        env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
      padding: 55px 0;
    }

    header {
      text-align: center;
      margin-bottom: 45px;
    }

    .logo {
  width: 120px;
  height: 120px;
  margin: 0 auto 22px;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 12px 35px rgba(0,0,0,.35);
}

.logo img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: 28px;
}
    h1 {
      font-size: clamp(30px, 6vw, 48px);
      margin-bottom: 12px;
    }

    header p {
      color: #b9c7da;
      font-size: 17px;
      line-height: 1.9;
      max-width: 650px;
      margin: auto;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 25px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 35px rgba(0,0,0,.18);
      transition: transform .2s ease, background .2s ease;
    }

    @media (hover: hover) {
      .card:hover {
        transform: translateY(-4px);
        background: rgba(255,255,255,.11);
      }
      .open:hover { opacity: .85; }
    }

    .card:active {
      transform: scale(.985);
      background: rgba(255,255,255,.11);
    }

    /* البطاقة كلها قابلة للضغط */
    .open::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
    }

    .open:focus-visible {
      outline: 3px solid #36a3ff;
      outline-offset: 3px;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0,0,0,.30);
      background: rgba(255,255,255,.08);
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .card p {
      color: #b9c7da;
      font-size: 14px;
      line-height: 1.8;
      min-height: 50px;
      margin-bottom: 20px;
    }

    .open {
      display: block;
      text-align: center;
      text-decoration: none;
      color: white;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #147bd1, #0ba594);
      transition: opacity .2s ease;
    }


    [hidden] { display: none !important; }

    /* الأقسام */
    .search { margin: 0 auto 30px; max-width: 520px; }
    .search input {
      width: 100%; font: inherit; font-size: 16px; color: #fff;
      background: rgba(255,255,255,.075); border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px; padding: 13px 18px; outline: none;
    }
    .search input::placeholder { color: #8293aa; }
    .search input:focus { border-color: #36a3ff; background: rgba(255,255,255,.1); }

    .group { margin-bottom: 38px; }
    .group-head {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      margin: 0 4px 14px; padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .group-head h2 { font-size: 20px; }
    .group-head .count {
      font-size: 12px; color: #b9c7da; background: rgba(255,255,255,.08);
      padding: 2px 9px; border-radius: 99px;
    }
    .group-head small { color: #8293aa; font-size: 13px; }

    .app-icon.emoji {
      display: flex; align-items: center; justify-content: center; font-size: 36px;
      background: linear-gradient(135deg, rgba(20,123,209,.35), rgba(11,165,148,.35));
    }
    .open.download { background: linear-gradient(135deg, #4b5d78, #2f3d52); }
    .empty, .load-error { text-align: center; color: #b9c7da; padding: 30px 0; }
    .load-error a { color: #36a3ff; }

    footer {
      text-align: center;
      color: #8293aa;
      margin-top: 45px;
      font-size: 14px;
      line-height: 1.9;
    }

    /* الجوال: قائمة مدمجة مثل تطبيقات الآيفون */
    @media (max-width: 600px) {
      .container {
        width: auto;
        padding: 26px 16px 30px;
      }

      header {
        margin-bottom: 24px;
      }

      .logo {
        width: 92px;
        height: 92px;
        border-radius: 22px;
        margin-bottom: 16px;
      }
      .logo img { border-radius: 22px; }

      header p {
        font-size: 15px;
        line-height: 1.8;
      }

      .apps {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .card {
        display: grid;
        grid-template-columns: 58px 1fr 18px;
        grid-template-areas:
          "icon title arrow"
          "icon desc  arrow";
        column-gap: 14px;
        row-gap: 2px;
        align-items: center;
        padding: 13px 14px;
        border-radius: 18px;
        min-height: 84px;
      }

      .app-icon {
        grid-area: icon;
        width: 58px;
        height: 58px;
        border-radius: 14px;
        margin: 0;
      }

      .card h2 {
        grid-area: title;
        font-size: 17px;
        margin: 0;
        align-self: end;
      }

      .card p {
        grid-area: desc;
        font-size: 13px;
        line-height: 1.55;
        min-height: auto;
        margin: 0;
        align-self: start;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* الزر يصبح سهمًا صغيرًا، والبطاقة كلها رابط */
      .open {
        grid-area: arrow;
        width: 18px;
        height: 18px;
        padding: 0;
        background: none;
        font-size: 0;
        color: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* السهم يُرسم بعنصر داخلي حتى تبقى البطاقة كلها قابلة للضغط */
      .open::before {
        content: "";
        width: 10px;
        height: 10px;
        border-left: 2.5px solid #7f93ad;
        border-bottom: 2.5px solid #7f93ad;
        border-radius: 1px;
        transform: rotate(45deg);
      }


      .search { margin-bottom: 22px; }
      .group { margin-bottom: 26px; }
      .group-head h2 { font-size: 17px; }
      .app-icon.emoji { font-size: 28px; }
      .open.download { background: none; }

      footer {
        margin-top: 30px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .open { transition: none; }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <div class="logo">
  <img src="logo.webp" alt="برامج عادل" width="120" height="120">
</div>
      <p>
        مجموعة من البرامج والأدوات العربية البسيطة التي طورتها
        لتنظيم الأعمال والمهام اليومية، وتعمل مباشرة من المتصفح.
      </p>
    </header>

    <div class="search">
      <input id="q" type="search" placeholder="ابحث عن برنامج…" aria-label="ابحث عن برنامج" autocomplete="off">
    </div>

    <div id="sections" aria-live="polite"></div>
    <p id="empty" class="empty" hidden>لا يوجد برنامج بهذا الاسم.</p>

    <footer>
      <div>برامج وأدوات شخصية من تطوير عادل الغامدي</div>
      <div>© 2026</div>
    </footer>

  </main>


  <script>
  (function () {
    var root = document.getElementById('sections');
    var empty = document.getElementById('empty');
    var q = document.getElementById('q');

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function card(p) {
      var a = el('article', 'card');
      a.dataset.search = (p.name + ' ' + p.desc).toLowerCase();
      var ic = el('div', 'app-icon' + (p.icon ? '' : ' emoji'));
      if (p.icon) {
        var img = el('img');
        img.loading = 'lazy'; img.decoding = 'async';
        img.width = 72; img.height = 72; img.src = p.icon; img.alt = p.name;
        ic.appendChild(img);
      } else {
        ic.textContent = p.emoji || '📦';
        ic.setAttribute('aria-hidden', 'true');
      }
      var link = el('a', 'open' + (p.type === 'windows' ? ' download' : ''),
                    p.type === 'windows' ? 'صفحة التنزيل' : 'فتح البرنامج');
      link.href = p.url;
      if (p.type === 'windows') { link.target = '_blank'; link.rel = 'noopener'; }
      a.append(ic, el('h2', null, p.name), el('p', null, p.desc), link);
      return a;
    }

    function render(data) {
      data.sections.forEach(function (s) {
        var items = data.programs.filter(function (p) { return p.section === s.id; });
        if (!items.length) return;
        var g = el('section', 'group');
        g.id = s.id;
        var head = el('div', 'group-head');
        head.append(el('h2', null, (s.emoji ? s.emoji + ' ' : '') + s.title),
                    el('span', 'count', items.length));
        if (s.note) head.appendChild(el('small', null, s.note));
        var grid = el('div', 'apps');
        items.forEach(function (p) { grid.appendChild(card(p)); });
        g.append(head, grid);
        root.appendChild(g);
      });
    }

    function filter() {
      var term = q.value.trim().toLowerCase();
      var any = false;
      root.querySelectorAll('.group').forEach(function (g) {
        var shown = 0;
        g.querySelectorAll('.card').forEach(function (c) {
          var ok = !term || c.dataset.search.indexOf(term) !== -1;
          c.hidden = !ok;
          if (ok) shown++;
        });
        g.hidden = shown === 0;
        if (shown) any = true;
      });
      empty.hidden = any;
    }

    fetch('programs.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw r; return r.json(); })
      .then(function (data) { render(data); q.addEventListener('input', filter); })
      .catch(function () {
        root.innerHTML = '<p class="load-error">تعذر تحميل قائمة البرامج. <a href="">أعد المحاولة</a></p>';
      });
  })();
  </script>
  <script src="stats.js" defer></script>
</body>
</html>
